name: Wochen-Check

on:
  schedule:
    - cron: "17 6 * * 1"   # Montags ca. 7–8 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  issues: write

jobs:
  issue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const d = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Wochen-Check ${d}`,
              body: [
                "Abhaken am Handy (ca. 15 Min.):",
                "",
                "- [ ] Diese Woche 3–4 Videos gepostet? (Liste: `04-content/kanal/INDEX.md`)",
                "- [ ] Zahlen als Kommentar hier notieren: Follower TikTok / Abos YouTube / bestes Video (Aufrufe)",
                "- [ ] Neue Skripte gelesen und `status: freigegeben` gesetzt (oder Änderungen gewünscht)",
                "- [ ] Videos für nächste Woche produziert und eingeplant?",
                "- [ ] `STATUS.md` gelesen – gibt es etwas zu entscheiden?",
                "",
                "Wenn alles erledigt ist: Issue schließen."
              ].join("\n")
            });
